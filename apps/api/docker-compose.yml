services:
  postgres:
    image: postgres:16-alpine
    container_name: platesense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: platesense
      POSTGRES_PASSWORD: platesense
      POSTGRES_DB: platesense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platesense"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platesense-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://platesense:platesense@postgres:5432/platesense
      SECRET_KEY: change-me-in-production
      RESET_PASSWORD_TOKEN_SECRET: change-me-reset-secret
      VERIFICATION_TOKEN_SECRET: change-me-verification-secret
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app/app  # Hot-reload in dev

volumes:
  pgdata:
